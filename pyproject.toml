[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-unlock-kit"
version = "0.1.0"
description = "Windows helper for nv-uefi-unlocker: card check, stick builder, verifier, A/B report"
requires-python = ">=3.10"
license = { text = "GPL-2.0-only" }

[project.optional-dependencies]
bench = ["torch"]

[project.scripts]
adakit = "adakit.__main__:main"

[tool.setuptools]
packages = ["adakit"]

[tool.setuptools.package-data]
adakit = ["compat.json"]
